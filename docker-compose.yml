services:
  # Docling - PDF 파서 (포트 8000)
  # Grobid 자리를 대체. 책 챕터/논문 모두 더 안정적이라 frontend는 동일 엔드포인트 사용.
  docling:
    build:
      context: .
      dockerfile: Dockerfile.docling
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Kokoro TTS 서버 (포트 8001) - 무료 로컬 TTS
  kokoro:
    build:
      context: .
      dockerfile: Dockerfile.kokoro
    ports:
      - "8001:8001"
    restart: unless-stopped
