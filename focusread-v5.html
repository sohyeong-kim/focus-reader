        function splitSentences(text) {
            // 약어들을 임시 토큰으로 치환
            const abbreviations = [
                'et al', 'i\\.e', 'e\\.g', 'Fig', 'Figs', 'Tab', 'Eq', 'Eqs',
                'Dr', 'Mr', 'Mrs', 'Ms', 'Prof', 'Jr', 'Sr', 'Inc', 'Ltd', 'Corp',
                'vs', 'etc', 'al', 'cf', 'viz', 'approx', 'ca', 'no', 'nos',
                'Sec', 'Sect', 'Ch', 'Vol', 'pp', 'p', 'ed', 'eds', 'Trans',
                'Proc', 'Conf', 'Int', 'Natl', 'Rev', 'Lett', 'Phys', 'Chem',
                'Biol', 'Math', 'Comp', 'Sci', 'Eng', 'Med', 'Acad'
            ];
            
            let processed = text;
            const placeholders = [];
            let placeholderIdx = 0;
            
            // 약어 + 마침표를 임시 치환
            abbreviations.forEach((abbr) => {
                const regex = new RegExp(`\\b(${abbr})\\.`, 'gi');
                processed = processed.replace(regex, (match) => {
                    const placeholder = `__ABBR${placeholderIdx++}__`;
                    placeholders.push({ placeholder, original: match });
                    return placeholder;
                });
            });
            
            // 숫자 + 마침표 (예: "1.", "2.3", 소수점) 치환
            processed = processed.replace(/(\d+)\.(\d+)/g, (match) => {
                const placeholder = `__DECIMAL${placeholderIdx++}__`;
                placeholders.push({ placeholder, original: match });
                return placeholder;
            });
            processed = processed.replace(/(\d+)\.\s*(?=[a-z])/gi, (match) => {
                const placeholder = `__NUM${placeholderIdx++}__`;
                placeholders.push({ placeholder, original: match });
                return placeholder;
            });
            
            // URL 치환
            processed = processed.replace(/https?:\/\/[^\s]+/g, (match) => {
                const placeholder = `__URL${placeholderIdx++}__`;
                placeholders.push({ placeholder, original: match });
                return placeholder;
            });
            
            // 괄호 안 내용 보호 (마침표 포함된 괄호)
            processed = processed.replace(/\([^)]*\.[^)]*\)/g, (match) => {
                const placeholder = `__PAREN${placeholderIdx++}__`;
                placeholders.push({ placeholder, original: match });
                return placeholder;
            });
            
            // 인용 번호 보호 [1], [1, 2], [1-3] 등
            processed = processed.replace(/\[[^\]]+\]/g, (match) => {
                const placeholder = `__CITE${placeholderIdx++}__`;
                placeholders.push({ placeholder, original: match });
                return placeholder;
            });
            
            // 문장 분리: 마침표/느낌표/물음표 뒤에 공백 또는 대문자가 오는 경우
            // 1) 기본: .!? 뒤에 공백이 있으면 분리
            // 2) .!? 뒤에 바로 대문자가 오면 분리 (공백 없는 경우)
            let sentences = [];
            
            // 먼저 공백 기준으로 분리
            let parts = processed.split(/(?<=[.!?])\s+/);
            
            // 각 파트에서 .!? 뒤에 바로 대문자가 오는 경우 추가 분리
            parts.forEach(part => {
                // .!? 뒤에 바로 대문자가 오는 패턴 분리
                const subParts = part.split(/(?<=[.!?])(?=[A-Z])/);
                sentences.push(...subParts);
            });
            
            // 빈 문장 제거
            sentences = sentences.filter(s => s.trim());
            
            // 플레이스홀더 복원
            return sentences.map(s => {
                let restored = s;
                placeholders.forEach(p => {
                    restored = restored.replace(p.placeholder, p.original);
                });
                return restored.trim();
            });
        }

        // Bionic Reading: bold first part of each word
        function toBionicText(text) {
            return text.replace(/\b([a-zA-Z]+)\b/g, (match) => {
                if (match.length <= 1) return match;
                const boldLen = Math.max(1, Math.ceil(match.length * 0.4));
                const boldPart = match.slice(0, boldLen);
                const lightPart = match.slice(boldLen);
                return `<span class="bionic-bold">${boldPart}</span><span class="bionic-light">${lightPart}</span>`;
            });
        }
        
        // Pastel colors for semantic chunks
        const CHUNK_COLORS = [
            "#FFE4B5",  // Moccasin
            "#B0E0E6",  // PowderBlue
            "#DDA0DD",  // Plum
            "#98FB98",  // PaleGreen
            "#FFB6C1",  // LightPink
            "#87CEEB",  // SkyBlue
            "#F0E68C",  // Khaki
            "#E6E6FA",  // Lavender
        ];
        
        // Cache for chunked sentences
        let sentenceChunks = {};
        
        // Fetch semantic chunks from server
        async function fetchChunks(sentenceList) {
            try {
                const response = await fetch('http://localhost:8000/chunk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sentences: sentenceList })
                });
                if (!response.ok) throw new Error('Chunk API failed');
                const data = await response.json();
                return data.results;
            } catch (e) {
                console.error('Chunk fetch error:', e);
                return null;
            }
        }
        
        // Format sentence with semantic chunks
        function formatSentenceWithChunks(text, chunks) {
            if (!chunks || chunks.length === 0) {
                return toBionicText(text);
            }
            
            return chunks.map((chunk, i) => {
                const color = CHUNK_COLORS[i % CHUNK_COLORS.length];
                const bionicText = toBionicText(chunk.text);
                return `<span class="semantic-chunk" style="background-color: ${color};">${bionicText}</span>`;
            }).join(' ');
        }
        
        // Apply bionic text to sentence (fallback)
        function formatSentence(text) {
            return toBionicText(text);
        }
        
        async function renderSentences() {
            const container = document.getElementById('paragraph-content');
            if (!sentences.length) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">👆</div>PDF에서 문단을 클릭하세요</div>`;
                clearSentenceOverlays();
                return;
            }

            // First render with basic bionic (fast)
            container.innerHTML = sentences.map((s, i) =>
                `<span class="sentence${i === sentenceIndex ? ' active' : ''}" data-idx="${i}">${formatSentence(s)}</span>`
            ).join(' ');

            attachSentenceClickHandlers();
            scrollToSentence();
            renderSentenceOverlay();
            
            // Then fetch chunks and re-render active sentence with semantic highlighting
            await updateActiveSentenceChunks();
        }
        
        function attachSentenceClickHandlers() {
            document.querySelectorAll('#paragraph-content .sentence').forEach(el => {
                el.onclick = async () => {
                    sentenceIndex = parseInt(el.dataset.idx);
                    highlightSentence();
                    await updateActiveSentenceChunks();
                };
            });
        }
        
        async function updateActiveSentenceChunks() {
            if (!sentences[sentenceIndex]) return;
            
            const sentence = sentences[sentenceIndex];
            const cacheKey = sentence.substring(0, 50);  // Use first 50 chars as key
            
            // Check cache
            if (!sentenceChunks[cacheKey]) {
                const results = await fetchChunks([sentence]);
                if (results && results[0]) {
                    sentenceChunks[cacheKey] = results[0].chunks;
                }
            }
            
            // Apply chunks to active sentence
            const chunks = sentenceChunks[cacheKey];
            if (chunks) {
                const activeEl = document.querySelector('.sentence.active');
                if (activeEl) {
                    activeEl.innerHTML = formatSentenceWithChunks(sentence, chunks);
                }
            }
        }
        
        async function highlightSentence() {
            document.querySelectorAll('.sentence').forEach((el, i) => {
                el.classList.toggle('active', i === sentenceIndex);
                // Reset non-active sentences to basic bionic
                if (i !== sentenceIndex && sentences[i]) {
                    el.innerHTML = formatSentence(sentences[i]);
                }
            });
            scrollToSentence();
            renderSentenceOverlay();
        }
        
        function clearSentenceOverlays() {
            document.querySelectorAll('.sentence-block').forEach(el => el.remove());
        }
        
        function renderSentenceOverlay() {
            clearSentenceOverlays();
            
            if (!selectedParagraph || !selectedParagraph.sentences) return;
            
            const sentData = selectedParagraph.sentences[sentenceIndex];
            if (!sentData || !sentData.bboxes) return;
            
            const scale = pdfScale;
            
            for (const bbox of sentData.bboxes) {
                const pageNum = bbox.page || bbox.pageNum;
                const pageContainer = document.querySelector(`.pdf-page[data-page="${pageNum}"]`);
                if (!pageContainer) continue;
                
                const layer = pageContainer.querySelector('.paragraph-layer');
                if (!layer) continue;
                
                const block = document.createElement('div');
                block.className = 'sentence-block active';
                block.style.left = `${bbox.x * scale}px`;
                block.style.top = `${bbox.y * scale}px`;
                block.style.width = `${bbox.width * scale}px`;
                block.style.height = `${bbox.height * scale}px`;
                layer.appendChild(block);
            }
            
            // 문장 블록이 보이도록 스크롤
            const activeBlock = document.querySelector('.sentence-block.active');
            if (activeBlock) {
                const container = document.getElementById('pdf-container');
                const blockRect = activeBlock.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                // 블록이 화면에 없으면 스크롤
                if (blockRect.top < containerRect.top || blockRect.bottom > containerRect.bottom) {
                    const scrollTop = container.scrollTop + (blockRect.top - containerRect.top) - (containerRect.height / 3);
                    container.scrollTo({ top: scrollTop, behavior: 'smooth' });
                }
            }
        }

        function scrollToSentence() {
            document.querySelector('.sentence.active')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ========== Notes ==========
        function switchTab(tab) {
            document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === `tab-${tab}`));
            
            if (tab === 'notes') {
                renderAllNotes();
            }
        }

        function renderAllNotes() {
            const container = document.getElementById('all-notes-content');
            if (!currentPaper) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><div>논문을 먼저 열어주세요</div></div>';
                return;
            }

            const notesWithPara = [];
            for (const section of currentPaper.sections) {
                for (const para of section.paragraphs) {
                    const note = currentPaper.getNote(para.id);
                    if (note && note.trim()) {
                        notesWithPara.push({ section, para, note });
                    }
                }
            }

            if (notesWithPara.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><div>아직 작성된 노트가 없습니다</div></div>';
                return;
            }

            container.innerHTML = notesWithPara.map(({ section, para, note }) => `
                <div class="note-card" onclick="goToParagraph('${para.id}')">
                    <div class="note-card-header">
                        <span class="note-card-section">${section.title}</span>
                        <span class="note-card-page">Page ${para.pageNum}</span>
                    </div>
                    <div class="note-card-text">${para.text.substring(0, 100)}...</div>
                    <div class="note-card-note">${note}</div>
                </div>
            `).join('');
        }

        function goToParagraph(paraId) {
            if (!currentPaper) return;
            for (const section of currentPaper.sections) {
                const para = section.paragraphs.find(p => p.id === paraId);
                if (para) {
                    switchTab('reader');
                    selectParagraphAndScroll(section, para);
                    return;
                }
            }
        }

        function exportNotes() {
            if (!currentPaper) return;

            let markdown = `# ${currentPaper.title}\n\n`;
            if (currentPaper.authors) {
                markdown += `**Authors:** ${currentPaper.authors}\n\n`;
            }
            markdown += `---\n\n`;

            for (const section of currentPaper.sections) {
                const sectionNotes = section.paragraphs
                    .map(p => ({ para: p, note: currentPaper.getNote(p.id) }))
                    .filter(x => x.note && x.note.trim());

                if (sectionNotes.length > 0) {
                    markdown += `## ${section.title}\n\n`;
                    for (const { para, note } of sectionNotes) {
                        markdown += `> ${para.text.substring(0, 150)}...\n\n`;
                        markdown += `${note}\n\n`;
                        markdown += `---\n\n`;
                    }
                }
            }

            // 다운로드
            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentPaper.title.substring(0, 50).replace(/[^a-zA-Z0-9]/g, '_')}_notes.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function saveNote() {
            const ta = document.getElementById('notes-textarea');
            const paraId = ta.dataset.paraId;
            if (paraId && currentPaper) {
                currentPaper.setNote(paraId, ta.value);
                await dbPut('papers', currentPaper.toJSON());
            }
        }

        // ========== Zoom ==========
        async function zoomIn() { 
            currentScale = Math.min(currentScale + 0.2, 4); 
            updateZoom(); 
            await rerenderPages();
        }
        async function zoomOut() { 
            currentScale = Math.max(currentScale - 0.2, 0.3); 
            updateZoom(); 
            await rerenderPages();
        }
        async function zoomFit() { 
            currentScale = baseScale; 
            updateZoom(); 
            await rerenderPages();
        }
        function updateZoom() { 
            document.getElementById('zoom-display').textContent = Math.round(currentScale * 100) + '%'; 
        }
        
        // 줌 시 재렌더링 (sections 유지)
        async function rerenderPages() {
            const container = document.getElementById('pdf-container');
            container.innerHTML = '';
            const dpr = window.devicePixelRatio || 2;
            
            for (let num = 1; num <= pdfDoc.numPages; num++) {
                const page = await pdfDoc.getPage(num);
                const vp = page.getViewport({ scale: currentScale });

                const wrapper = document.createElement('div');
                wrapper.className = 'pdf-page';
                wrapper.dataset.page = num;
                wrapper.style.width = vp.width + 'px';
                wrapper.style.height = vp.height + 'px';

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = vp.width * dpr;
                canvas.height = vp.height * dpr;
                canvas.style.width = vp.width + 'px';
                canvas.style.height = vp.height + 'px';
                ctx.scale(dpr, dpr);
                wrapper.appendChild(canvas);

                // Paragraph overlay
                const paraLayer = document.createElement('div');
                paraLayer.className = 'paragraph-layer';

                if (currentPaper) {
                    for (const section of currentPaper.sections) {
                        for (const para of section.paragraphs) {
                            // Grobid 모드에서는 bounds가 없음 - 스킵
                            if (!para.bounds) continue;
                            if (para.pageNum !== num) continue;

                            const block = document.createElement('div');
                            block.className = 'paragraph-block' + (para.isHeading ? ' is-heading' : '');
                            block.style.left = (para.bounds.x * currentScale) + 'px';
                            block.style.top = (para.bounds.y * currentScale) + 'px';
                            block.style.width = (para.bounds.w * currentScale) + 'px';
                            block.style.height = (para.bounds.h * currentScale) + 'px';
                            block.dataset.paraId = para.id;
                            block.dataset.debug = para.id;

                            paraLayer.appendChild(block);
                        }
                    }
                }
                wrapper.appendChild(paraLayer);

                const textLayer = document.createElement('div');
                textLayer.className = 'textLayer';
                textLayer.style.width = vp.width + 'px';
                textLayer.style.height = vp.height + 'px';
                textLayer.style.setProperty('--scale-factor', String(currentScale));
                wrapper.appendChild(textLayer);

                wrapper.addEventListener('dblclick', (e) => {
                    const rect = wrapper.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const result = findParagraphAtPosition(num, x, y);
                    if (result) selectParagraph(result.section, result.paragraph);
                });

                container.appendChild(wrapper);

                await page.render({ canvasContext: ctx, viewport: vp }).promise;
                const textContent = await page.getTextContent();
                await pdfjsLib.renderTextLayer({
                    textContentSource: textContent,
                    container: textLayer,
                    viewport: vp,
                    textDivs: []
                }).promise;
            }

            container.removeEventListener('mouseup', handleTextSelection);
            container.addEventListener('mouseup', handleTextSelection);
            
            if (debugMode) {
                container.classList.add('debug-mode');
            }
        }

        // ========== Chat ==========
        const TRANSLATE_PROMPT = `너는 최신 AI기술을 다 아는 전문가야. 영어 논문들을 친구한테 말하듯이 반말로해줘 AI에서 많이 쓰이는 영단어들은 한국말로 번역하지마 주로 조사나 문장구조만 한국어로해. 예를들어 annotator는 번역하지말고 annotator라고하고 모델도 걍 model, 데이터도 data. 이런식으로 번역해. Our data collection approach can be divided based on the post-training method, i.e., SFT or preference tuning. 이걸 예를어 다음과 같이 번역해 우리의 data collection approach는 post-training method 즉 SFT 또는 preference tuning에 따라 나뉠수있다. 이런식으로... 알겠지? 그리고 불릿포인트로 보기좋게 정리해서 보여줘. 시킨거말고는 하지마. 뭘 해줄까? 이런거 묻지마.`;

        async function translateParagraph() {
            if (!selectedParagraph) {
                alert('먼저 문단을 선택해주세요.');
                return;
            }
            if (!apiKey) {
                alert('API 키를 먼저 설정해주세요.');
                showModal('api-modal');
                return;
            }

            const btn = document.getElementById('translate-btn');
            const textarea = document.getElementById('notes-textarea');
            
            btn.disabled = true;
            btn.classList.add('loading');
            btn.textContent = '⏳ 번역 중...';

            try {
                const res = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 2048,
                        messages: [{
                            role: 'user',
                            content: TRANSLATE_PROMPT + '\n\n다음 문단을 번역해:\n\n' + selectedParagraph.text
                        }]
                    })
                });

                if (!res.ok) throw new Error('API 오류: ' + res.status);
                const data = await res.json();
                const translation = data.content[0].text;

                // 노트에 append
                const currentNote = textarea.value;
                const separator = currentNote.trim() ? '\n\n---\n\n' : '';
                const newNote = currentNote + separator + '🤓 번역:\n' + translation;
                
                textarea.value = newNote;
                await saveNote();

                // 성공 피드백
                btn.textContent = '✅ 완료!';
                setTimeout(() => {
                    btn.textContent = '🤓 번역하기';
                }, 1500);

            } catch (err) {
                console.error('Translation error:', err);
                alert('번역 오류: ' + err.message);
                btn.textContent = '🤓 번역하기';
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            addChat('user', msg);
            input.value = '';

            if (!apiKey) { 
                addChat('assistant', '🔑 API 키가 필요해요!\n\n오른쪽 위 [🔑 API] 버튼을 눌러서 Claude API 키를 입력해주세요.\n\nAPI 키는 https://console.anthropic.com 에서 발급받을 수 있어요.'); 
                return; 
            }

            try {
                const res = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1024,
                        system: '논문 읽기 도와주는 AI야. 반말로 간결하게 핵심만 답해.',
                        messages: [{ role: 'user', content: msg }]
                    })
                });
                if (!res.ok) throw new Error('API 오류: ' + res.status);
                const data = await res.json();
                addChat('assistant', data.content[0].text);
            } catch (err) {
                addChat('assistant', '오류: ' + err.message);
            }
        }

        function addChat(role, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-message ' + role;
            div.innerHTML = text.replace(/\n/g, '<br>');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // ========== Modal ==========
        function showModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function saveApiKey() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('claude_api_key', apiKey);
            closeModal('api-modal');
        }
        
        // ========== Collapsible Sections ==========
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            const isCollapsing = !section.classList.contains('collapsed');
            
            const allSections = ['paragraph-section', 'notes-section', 'chat-section'];
            const otherSections = allSections.filter(id => id !== sectionId);
            
            if (isCollapsing) {
                // 접으려고 할 때: 다른 섹션 중 하나라도 펼쳐져 있는지 확인
                const hasExpandedOther = otherSections.some(id => {
                    const el = document.getElementById(id);
                    return el && !el.classList.contains('collapsed');
                });
                
                if (!hasExpandedOther) {
                    // 모든 다른 섹션이 접혀있으면, 첫 번째로 접힌 다른 섹션을 펼침
                    for (const otherId of otherSections) {
                        const otherEl = document.getElementById(otherId);
                        if (otherEl && otherEl.classList.contains('collapsed')) {
                            otherEl.classList.remove('collapsed');
                            otherEl.style.height = '';
                            otherEl.style.flex = '';
                            // 상태 저장
                            const collapsed = JSON.parse(localStorage.getItem('collapsedSections') || '{}');
                            collapsed[otherId] = false;
                            localStorage.setItem('collapsedSections', JSON.stringify(collapsed));
                            break;
                        }
                    }
                }
            }
            
            section.classList.toggle('collapsed');
            section.style.height = '';
            section.style.flex = '';
            
            // 상태 저장
            const collapsed = JSON.parse(localStorage.getItem('collapsedSections') || '{}');
            collapsed[sectionId] = section.classList.contains('collapsed');
            localStorage.setItem('collapsedSections', JSON.stringify(collapsed));
        }
        
        // 저장된 collapse 상태 복원
        function restoreCollapsedState() {
            const collapsed = JSON.parse(localStorage.getItem('collapsedSections') || '{}');
            Object.keys(collapsed).forEach(id => {
                if (collapsed[id]) {
                    document.getElementById(id)?.classList.add('collapsed');
                }
            });
        }
    </script>
