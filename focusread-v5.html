    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ========== PaperDocument Class ==========
        class PaperDocument {
            constructor(id) {
                this.id = id;
                this.title = '';
                this.authors = '';
                this.fileName = '';
                this.fileSize = 0;
                this.folderId = null;
                this.addedAt = new Date().toISOString();
                this.lastRead = null;
                this.sections = []; // { title, paragraphs: [{ id, text, pageNum, bounds, isHeading }] }
                this.notes = {}; // paragraphId -> note text
                this.serverParsed = false; // PyMuPDF 서버로 파싱했는지 여부
            }

            // PDF에서 구조 추출 - 기본 정보만
            async extractBasicInfo(pdfDoc) {
                const meta = await pdfDoc.getMetadata();
                if (meta.info?.Title) {
                    this.title = meta.info.Title;
                }
                if (meta.info?.Author) {
                    this.authors = meta.info.Author;
                }
                return this;
            }

            // Grobid 서버를 통해 PDF 구조 추출 (캐시 지원)
            async extractFromServer(pdfArrayBuffer, useCache = true) {
                const statusEl = document.getElementById('parse-status');
                
                // 캐시 확인
                if (useCache) {
                    try {
                        const cached = await dbGet('grobidCache', this.id);
                        if (cached && cached.sections && cached.sections.length > 0) {
                            console.log('✅ Using cached Grobid data');
                            if (statusEl) statusEl.textContent = '✅ 캐시 사용';
                            
                            this.title = cached.title || this.title;
                            this.authors = cached.authors || this.authors;
                            this.sections = cached.sections;
                            this.serverParsed = true;
                            this.parseMethod = 'grobid-cached';
                            
                            const totalParas = this.sections.reduce((sum, s) => sum + s.paragraphs.length, 0);
                            if (statusEl) {
                                statusEl.textContent = `✅ 캐시: ${this.sections.length}섹션, ${totalParas}문단`;
                                statusEl.style.color = 'var(--accent-green)';
                            }
                            return true;
                        }
                    } catch (e) {
                        console.warn('Cache check failed:', e);
                    }
                }
                
                try {
                    console.log('🔄 Trying Grobid server parsing...');
                    if (statusEl) statusEl.textContent = '🔄 Grobid 파싱 중...';
                    
                    // pdfArrayBuffer가 Array일 수 있으므로 Uint8Array로 변환
                    const uint8Data = pdfArrayBuffer instanceof Uint8Array 
                        ? pdfArrayBuffer 
                        : new Uint8Array(pdfArrayBuffer);
                    const blob = new Blob([uint8Data], { type: 'application/pdf' });
                    console.log('📤 Sending PDF to Grobid, size:', blob.size, 'bytes');
                    
                    const formData = new FormData();
                    formData.append('file', blob, this.fileName || 'document.pdf');
                    
                    const response = await fetch('http://localhost:8000/process', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    console.log('📦 Grobid response:', data);
                    console.log('📦 Title:', data.title);
                    console.log('📦 Authors:', data.authors);
                    console.log('📦 Sections:', data.sections?.length || 0);
                    
                    // 제목 설정
                    if (data.title) {
                        this.title = data.title;
                        console.log('✅ Title set to:', this.title);
                    }
                    
                    // 저자 설정
                    if (data.authors && data.authors.length > 0) {
                        this.authors = data.authors.join(', ');
                        console.log('✅ Authors set to:', this.authors);
                    }
                    
                    // 새 서버 응답에서 섹션과 문단 구성 (좌표 포함)
                    this.sections = [];
                    
                    // 서버가 직접 paragraphs 배열 반환 (좌표 포함, bboxes 배열 지원)
                    if (data.paragraphs && data.paragraphs.length > 0) {
                        // 타입별로 그룹화하여 섹션 구성
                        let currentSection = { title: 'Abstract', paragraphs: [] };
                        
                        for (const para of data.paragraphs) {
                            if (para.type === 'section_title') {
                                // 현재 섹션 저장 (비어있지 않으면)
                                if (currentSection.paragraphs.length > 0) {
                                    this.sections.push(currentSection);
                                }
                                // 새 섹션 시작
                                currentSection = {
                                    title: para.text,
                                    paragraphs: []
                                };
                            } else {
                                // 일반 문단 - bboxes 배열로 다중 페이지 지원
                                const bboxes = para.bboxes || [];
                                currentSection.paragraphs.push({
                                    id: `p_${para.id}`,
                                    text: para.text,
                                    // 다중 페이지를 위한 bboxes 배열
                                    bboxes: bboxes.map(bb => ({
                                        pageNum: bb.page,
                                        x: bb.x,
                                        y: bb.y,
                                        w: bb.width,
                                        h: bb.height
                                    })),
                                    // 첫 페이지 정보 (호환성)
                                    pageNum: bboxes[0]?.page || 1,
                                    bounds: bboxes[0] ? {
                                        x: bboxes[0].x,
                                        y: bboxes[0].y,
                                        w: bboxes[0].width,
                                        h: bboxes[0].height
                                    } : null,
                                    isHeading: para.type === 'section_title'
                                });
                            }
                        }
                        
                        // 마지막 섹션 저장
                        if (currentSection.paragraphs.length > 0) {
                            this.sections.push(currentSection);
                        }
                    }
                    // 기존 구조도 지원 (하위 호환)
                    else if (data.parsed && data.parsed.sections) {
                        for (const section of data.parsed.sections) {
                            const sectionData = {
                                title: section.title || 'Section',
                                paragraphs: []
                            };
                            
                            for (const para of (section.paragraphs || [])) {
                                // 서버가 페이지별 bbox 제공
                                const firstPage = Object.keys(para.bbox || {})[0];
                                const bbox = firstPage ? para.bbox[firstPage] : null;
                                
                                sectionData.paragraphs.push({
                                    id: `p_${sectionData.paragraphs.length}`,
                                    text: para.text,
                                    pageNum: firstPage ? parseInt(firstPage) : 1,
                                    bounds: bbox ? {
                                        x: bbox.x,
                                        y: bbox.y,
                                        w: bbox.width,
                                        h: bbox.height
                                    } : null,
                                    isHeading: false
                                });
                            }
                            
                            if (sectionData.paragraphs.length > 0) {
                                this.sections.push(sectionData);
                            }
                        }
                    }
                    
                    this.serverParsed = true;
                    this.parseMethod = 'grobid'; // 파싱 방법 저장
                    const totalParas = this.sections.reduce((sum, s) => sum + s.paragraphs.length, 0);
                    console.log(`✅ Grobid parsed: ${this.sections.length} sections, ${totalParas} paragraphs`);
                    
                    // 섹션 목록 출력
                    this.sections.forEach(s => {
                        console.log(`   [${s.title}] ${s.paragraphs.length} paragraphs`);
                    });
                    
                    // 캐시에 저장 (bounds는 없는 상태로 저장, 나중에 매칭 후 업데이트)
                    try {
                        await dbPut('grobidCache', {
                            id: this.id,
                            title: this.title,
                            authors: this.authors,
                            sections: this.sections,
                            parsedAt: new Date().toISOString()
                        });
                        console.log('💾 Grobid result cached');
                    } catch (e) {
                        console.warn('Cache save failed:', e);
                    }
                    
                    if (statusEl) {
                        statusEl.textContent = `✅ Grobid: ${this.sections.length}섹션, ${totalParas}문단`;
                        statusEl.style.color = 'var(--accent-green)';
                    }
                    
                    return true;
                } catch (error) {
                    console.warn('⚠️ Grobid parsing failed:', error);
                    if (statusEl) {
                        statusEl.textContent = '⚠️ Grobid 실패 → DOM 파싱';
                        statusEl.style.color = 'var(--accent-orange)';
                    }
                    return false;
                }
            }

            // 실제 렌더링 후 DOM 기반으로 문단 추출 (2-column 지원) - 폴백용
            extractParagraphsFromDOM(pageNum, textLayerDiv, scale) {
                // 서버에서 이미 파싱했으면 스킵
                if (this.serverParsed) return;
                
                const spans = textLayerDiv.querySelectorAll('span');
                if (spans.length === 0) return;

                const parentRect = textLayerDiv.getBoundingClientRect();
                const pageWidth = parentRect.width;
                const pageHeight = parentRect.height;
                
                // 모든 span 정보 수집
                const spanInfos = [];
                spans.forEach(span => {
                    const text = span.textContent;
                    if (!text || !text.trim()) return;
                    
                    const rect = span.getBoundingClientRect();
                    const top = rect.top - parentRect.top;
                    const left = rect.left - parentRect.left;
                    const bottom = rect.bottom - parentRect.top;
                    const right = rect.right - parentRect.left;
                    const fontSize = parseFloat(window.getComputedStyle(span).fontSize);
                    const centerX = (left + right) / 2;
                    
                    spanInfos.push({ text, left, top, right, bottom, fontSize, centerX });
                });
                
                if (spanInfos.length === 0) return;
                
                // 먼저 줄(line) 단위로 그룹핑
                const lines = [];
                let currentLine = { spans: [], top: null, bottom: null };
                
                // Y 좌표로 정렬 후 X 좌표로 정렬
                spanInfos.sort((a, b) => a.top - b.top || a.left - b.left);
                
                spanInfos.forEach(span => {
                    // 같은 줄인지 판단: Y 좌표가 비슷하면 같은 줄
                    if (currentLine.spans.length === 0) {
                        currentLine = { spans: [span], top: span.top, bottom: span.bottom };
                    } else {
                        const lineMiddle = (currentLine.top + currentLine.bottom) / 2;
                        const spanMiddle = (span.top + span.bottom) / 2;
                        const lineHeight = currentLine.bottom - currentLine.top;
                        
                        // Y 중심점이 lineHeight의 50% 이내면 같은 줄
                        if (Math.abs(spanMiddle - lineMiddle) < lineHeight * 0.5) {
                            currentLine.spans.push(span);
                            currentLine.bottom = Math.max(currentLine.bottom, span.bottom);
                            currentLine.top = Math.min(currentLine.top, span.top);
                        } else {
                            // 새 줄 시작
                            if (currentLine.spans.length > 0) {
                                // 줄 내에서 X 좌표로 정렬
                                currentLine.spans.sort((a, b) => a.left - b.left);
                                lines.push(currentLine);
                            }
                            currentLine = { spans: [span], top: span.top, bottom: span.bottom };
                        }
                    }
                });
                
                // 마지막 줄 추가
                if (currentLine.spans.length > 0) {
                    currentLine.spans.sort((a, b) => a.left - b.left);
                    lines.push(currentLine);
                }
                
                // 각 줄의 속성 계산
                lines.forEach(line => {
                    line.left = Math.min(...line.spans.map(s => s.left));
                    line.right = Math.max(...line.spans.map(s => s.right));
                    line.width = line.right - line.left;
                    line.centerX = (line.left + line.right) / 2;
                    line.text = line.spans.map(s => s.text).join(' ');
                    line.avgFontSize = line.spans.reduce((sum, s) => sum + s.fontSize, 0) / line.spans.length;
                });
                
                // 2-column 감지: 줄들의 X 분포 분석
                const midPoint = pageWidth / 2;
                const leftLines = lines.filter(l => l.centerX < midPoint * 0.9 && l.right < midPoint * 1.1);
                const rightLines = lines.filter(l => l.centerX > midPoint * 1.1 && l.left > midPoint * 0.9);
                const fullWidthLines = lines.filter(l => l.width > pageWidth * 0.6 || (l.left < midPoint * 0.5 && l.right > midPoint * 1.5));
                
                const is2Column = leftLines.length > 5 && rightLines.length > 5;
                
                console.log(`Page ${pageNum}: ${is2Column ? '2-column' : 'single-column'} (left: ${leftLines.length}, right: ${rightLines.length}, full: ${fullWidthLines.length})`);
                
                let paragraphIndex = this.sections.reduce((sum, s) => sum + s.paragraphs.length, 0);
                
                // 현재 섹션 찾기 또는 생성
                let currentSection = this.sections.length > 0 
                    ? this.sections[this.sections.length - 1] 
                    : { title: 'Document', paragraphs: [] };
                
                if (this.sections.length === 0) {
                    this.sections.push(currentSection);
                }
                
                // 줄을 문단으로 그룹핑하는 함수
                // columnType: 'fullwidth' | 'left' | 'right'
                const groupLinesToParagraphs = (columnLines, columnType = 'body') => {
                    if (columnLines.length === 0) return [];
                    
                    // Y 좌표로 정렬
                    columnLines.sort((a, b) => a.top - b.top);
                    
                    const paragraphs = [];
                    let currentPara = { lines: [], text: '' };
                    let lastLine = null;
                    
                    // 컬럼 내 일반적인 줄 간격 계산 (median)
                    const lineGaps = [];
                    for (let i = 1; i < columnLines.length; i++) {
                        const gap = columnLines[i].top - columnLines[i-1].bottom;
                        if (gap > 0 && gap < 50) lineGaps.push(gap);
                    }
                    lineGaps.sort((a, b) => a - b);
                    const medianGap = lineGaps.length > 0 ? lineGaps[Math.floor(lineGaps.length / 2)] : 10;
                    
                    // 일반적인 줄 너비 계산 (상위 80%)
                    const lineWidths = columnLines.map(l => l.width).sort((a, b) => b - a);
                    const typicalWidth = lineWidths[Math.floor(lineWidths.length * 0.2)] || lineWidths[0];
                    
                    // 일반 줄 높이 계산
                    const lineHeights = columnLines.map(l => l.bottom - l.top).sort((a, b) => a - b);
                    const typicalLineHeight = lineHeights[Math.floor(lineHeights.length * 0.5)] || 12;
                    
                    // 평균 폰트 크기 계산 (본문 기준)
                    const fontSizes = columnLines.map(l => l.avgFontSize).sort((a, b) => a - b);
                    const bodyFontSize = fontSizes[Math.floor(fontSizes.length * 0.5)] || 12;
                    
                    columnLines.forEach(line => {
                        // 필터링: 무시할 줄
                        const text = line.text.trim();
                        const lineWidth = line.right - line.left;
                        const lineHeight = line.bottom - line.top;
                        
                        // 0. 세로/회전된 텍스트 무시 (높이가 너비의 1.5배 이상)
                        if (lineHeight > lineWidth * 1.5 && text.length < 30) return;
                        
                        // 0-1. 페이지 가장자리의 세로 텍스트 (arxiv 로고 등)
                        if (line.left < pageWidth * 0.03 || line.right > pageWidth * 0.97) {
                            // 가장자리에 있는 짧은 텍스트 무시
                            if (text.length < 20) return;
                        }
                        
                        // 1. 너무 짧은 텍스트 (라벨, 숫자 등)
                        if (text.length < 5) return;
                        
                        // 2. 숫자/기호만 있는 줄 (차트 축, 번호 등)
                        if (/^[\d\.\,\-\+\%\s\(\)]+$/.test(text)) return;
                        
                        // 3. Figure/Table 캡션
                        if (/^(figure|fig\.?|table|tab\.?|algorithm)\s*[\d:]/i.test(text)) return;
                        
                        // 4. 페이지 번호 (페이지 상단/하단의 짧은 숫자)
                        if (text.length < 10 && /^\d+$/.test(text.trim()) && 
                            (line.top < pageHeight * 0.05 || line.top > pageHeight * 0.95)) return;
                        
                        // 5. 각주/미주 번호
                        if (/^[\*†‡§¶\d]+$/.test(text) && text.length < 5) return;
                        
                        // 새 문단 시작 조건
                        let isNewParagraph = false;
                        let reason = '';
                        
                        if (lastLine) {
                            const verticalGap = line.top - lastLine.bottom;
                            const avgLineHeight = (lastLine.bottom - lastLine.top + line.bottom - line.top) / 2;
                            const fontSizeDiff = Math.abs(line.avgFontSize - lastLine.avgFontSize);
                            
                            // 정렬 분석
                            const lastLineCenterOffset = Math.abs((lastLine.left + lastLine.right) / 2 - pageWidth / 2);
                            const lineCenterOffset = Math.abs((line.left + line.right) / 2 - pageWidth / 2);
                            const lastLineIsCentered = lastLineCenterOffset < pageWidth * 0.12;
                            const lineIsCentered = lineCenterOffset < pageWidth * 0.12;
                            
                            // ===== FULL-WIDTH 영역 (제목, Abstract 등) =====
                            if (columnType === 'fullwidth') {
                                // 중앙정렬된 요소들 (제목, 저자)
                                if (lastLineIsCentered && lineIsCentered) {
                                    if (fontSizeDiff > 1) {
                                        isNewParagraph = true;
                                        reason = 'fullwidth: font size change';
                                    }
                                    if (verticalGap > avgLineHeight * 1.5) {
                                        isNewParagraph = true;
                                        reason = 'fullwidth: large gap between centered';
                                    }
                                }
                                
                                // 정렬 변화 (중앙 -> 좌측, 좌측 -> 중앙)
                                if (lastLineIsCentered !== lineIsCentered) {
                                    isNewParagraph = true;
                                    reason = 'fullwidth: alignment change';
                                }
                                
                                // 좌측정렬 요소들 (Abstract 본문)
                                if (!lastLineIsCentered && !lineIsCentered) {
                                    // 큰 간격이면 분리
                                    if (verticalGap > avgLineHeight * 1.5) {
                                        isNewParagraph = true;
                                        reason = 'fullwidth: large gap in left-aligned';
                                    }
                                    // 폰트 크기 변화
                                    if (fontSizeDiff > 1.5) {
                                        isNewParagraph = true;
                                        reason = 'fullwidth: font change in left-aligned';
                                    }
                                    // "Abstract" 또는 섹션 키워드로 시작
                                    if (/^(abstract|introduction|1\.?\s)/i.test(text)) {
                                        isNewParagraph = true;
                                        reason = 'fullwidth: section keyword';
                                    }
                                }
                                
                                // 이전 줄이 짧게 끝남 (문단 끝)
                                if (lastLine.width < typicalWidth * 0.7 && verticalGap > medianGap) {
                                    isNewParagraph = true;
                                    reason = 'fullwidth: short line end';
                                }
                            }
                            // ===== 제목/저자 영역 (페이지 상단 25%, 2-column에서) =====
                            else if (line.top < pageHeight * 0.25) {
                                // 중앙정렬된 요소들: 간격이나 폰트 변화로 분리
                                if (lastLineIsCentered && lineIsCentered) {
                                    // 폰트 크기가 다르면 분리 (제목 vs 저자)
                                    if (fontSizeDiff > 1) {
                                        isNewParagraph = true;
                                        reason = 'title area: font size change';
                                    }
                                    // 간격이 줄 높이의 1.5배 이상이면 분리
                                    if (verticalGap > avgLineHeight * 1.5) {
                                        isNewParagraph = true;
                                        reason = 'title area: large gap';
                                    }
                                }
                                // 중앙정렬 -> 좌측정렬 (Abstract 시작)
                                if (lastLineIsCentered && !lineIsCentered) {
                                    isNewParagraph = true;
                                    reason = 'centered -> left aligned';
                                }
                            }
                            // ===== 본문 영역 (2-column 컬럼들) =====
                            else {
                                // 본문에서는 더 보수적으로 분리
                                
                                // 조건 1: 매우 큰 간격 (줄 높이의 1.8배 이상)
                                if (verticalGap > avgLineHeight * 1.8) {
                                    isNewParagraph = true;
                                    reason = 'body: very large gap';
                                }
                                // 조건 1-2: 일반 간격의 2.5배 이상
                                else if (verticalGap > medianGap * 2.5) {
                                    isNewParagraph = true;
                                    reason = 'body: gap > 2.5x median';
                                }
                                
                                // 조건 2: 이전 줄이 짧게 끝남 (문단 끝) + 적당한 간격
                                // 단, 이전 줄이 일반 너비의 60% 미만이고, 간격도 있어야 함
                                if (lastLine.width < typicalWidth * 0.6 && 
                                    verticalGap > medianGap * 1.5 &&
                                    line.left <= lastLine.left + 5) {  // 다음 줄이 왼쪽 정렬
                                    isNewParagraph = true;
                                    reason = 'body: short line end + gap';
                                }
                                
                                // 조건 3: 명확한 들여쓰기 (25px 이상) + 간격
                                const indentDiff = line.left - lastLine.left;
                                if (indentDiff > 25 && 
                                    lastLine.width > typicalWidth * 0.9 &&
                                    verticalGap > medianGap) {
                                    isNewParagraph = true;
                                    reason = 'body: clear indent';
                                }
                                
                                // 조건 4: 폰트 크기 크게 변화 (섹션 제목)
                                if (fontSizeDiff > 2) {
                                    isNewParagraph = true;
                                    reason = 'body: font size change (heading)';
                                }
                            }
                        }
                        
                        if (isNewParagraph) {
                            console.log(`New para: "${text.substring(0,30)}..." reason: ${reason}`);
                        }
                        
                        if (isNewParagraph && currentPara.lines.length > 0) {
                            // 현재 문단 저장
                            const para = finalizeParagraph(currentPara);
                            if (para) paragraphs.push(para);
                            currentPara = { lines: [], text: '' };
                        }
                        
                        currentPara.lines.push(line);
                        currentPara.text += (currentPara.text ? ' ' : '') + text;
                        lastLine = line;
                    });
                    
                    // 마지막 문단
                    if (currentPara.lines.length > 0) {
                        const para = finalizeParagraph(currentPara);
                        if (para) paragraphs.push(para);
                    }
                    
                    return paragraphs;
                };
                
                // 문단 최종 처리
                const finalizeParagraph = (para) => {
                    const text = para.text.trim();
                    
                    // 최소 길이 체크
                    if (text.length < 20) return null;
                    
                    // Bounding box 계산
                    const minX = Math.min(...para.lines.map(l => l.left)) / scale;
                    const maxX = Math.max(...para.lines.map(l => l.right)) / scale;
                    const minY = Math.min(...para.lines.map(l => l.top)) / scale;
                    const maxY = Math.max(...para.lines.map(l => l.bottom)) / scale;
                    const width = maxX - minX;
                    const height = maxY - minY;
                    
                    // 세로로 긴 박스 무시 (width < height * 0.5로 더 공격적으로)
                    if (width < height * 0.5) {
                        console.log(`Skip vertical: "${text.substring(0, 30)}..."`);
                        return null;
                    }
                    
                    // 페이지 가장자리에 있는 좁은 텍스트 무시 (사이드바, 로고 등)
                    if ((minX < pageWidth * 0.05 / scale || maxX > pageWidth * 0.95 / scale) && width < pageWidth * 0.1 / scale) {
                        console.log(`Skip edge text: "${text.substring(0, 30)}..."`);
                        return null;
                    }
                    
                    // 참조/인용 번호만 있는 경우 무시
                    if (/^\[[\d,\-\s]+\]$/.test(text) || /^[\d,\s]+$/.test(text)) {
                        return null;
                    }
                    
                    const avgFontSize = para.lines.reduce((sum, l) => sum + l.avgFontSize, 0) / para.lines.length;
                    const isHeading = avgFontSize > 13 && text.length < 100 && para.lines.length <= 2;
                    
                    return {
                        bounds: { x: minX, y: minY, w: width, h: height },
                        text,
                        isHeading,
                        avgFontSize,
                        minY
                    };
                };
                
                let allParagraphs = [];
                
                if (is2Column) {
                    // 2-column 처리: 각 영역에 맞는 columnType 전달
                    const fullWidthParas = groupLinesToParagraphs(fullWidthLines, 'fullwidth');
                    const leftParas = groupLinesToParagraphs(leftLines, 'left');
                    const rightParas = groupLinesToParagraphs(rightLines, 'right');
                    
                    // 컬럼 Y 범위
                    let leftYRange = { min: Infinity, max: -Infinity };
                    leftLines.forEach(l => {
                        leftYRange.min = Math.min(leftYRange.min, l.top);
                        leftYRange.max = Math.max(leftYRange.max, l.bottom);
                    });
                    
                    // full-width 분류
                    const topFullWidth = fullWidthParas.filter(p => p.minY * scale < leftYRange.min);
                    const bottomFullWidth = fullWidthParas.filter(p => p.minY * scale >= leftYRange.max);
                    
                    // 순서: 상단 full -> 좌측 -> 우측 -> 하단 full
                    allParagraphs = [
                        ...topFullWidth.sort((a, b) => a.minY - b.minY),
                        ...leftParas.sort((a, b) => a.minY - b.minY),
                        ...rightParas.sort((a, b) => a.minY - b.minY),
                        ...bottomFullWidth.sort((a, b) => a.minY - b.minY)
                    ];
                } else {
                    // Single column
                    allParagraphs = groupLinesToParagraphs(lines);
                    allParagraphs.sort((a, b) => a.minY - b.minY);
                }
                
                // sections에 추가
                allParagraphs.forEach(para => {
                    // 헤딩이면 새 섹션 생성
                    if (para.isHeading && /^(\d+\.?\s*)?[A-Z]/.test(para.text) && para.text.length < 80) {
                        currentSection = { title: para.text, paragraphs: [] };
                        this.sections.push(currentSection);
                    }
                    
                    const paraId = `p${pageNum}_${paragraphIndex++}`;
                    currentSection.paragraphs.push({
                        id: paraId,
                        text: para.text,
                        pageNum: pageNum,
                        bounds: para.bounds,
                        isHeading: para.isHeading
                    });
                });
            }

            // 특정 좌표에 해당하는 문단 찾기 (다중 페이지 지원)
            findParagraphAt(pageNum, x, y, scale) {
                for (const section of this.sections) {
                    for (const para of section.paragraphs) {
                        // bboxes 배열이 있으면 모든 bbox 확인
                        const bboxes = para.bboxes || (para.bounds ? [{
                            pageNum: para.pageNum,
                            x: para.bounds.x,
                            y: para.bounds.y,
                            w: para.bounds.w,
                            h: para.bounds.h
                        }] : []);
                        
                        for (const bbox of bboxes) {
                            if (bbox.pageNum !== pageNum) continue;
                            
                            const sx = bbox.x * scale;
                            const sy = bbox.y * scale;
                            const sw = bbox.w * scale;
                            const sh = bbox.h * scale;

                            if (x >= sx && x <= sx + sw && y >= sy && y <= sy + sh) {
                                return { section, paragraph: para };
                            }
                        }
                    }
                }
                return null;
            }

            // 문단 ID로 섹션 정보 찾기
            findSectionByParagraphId(paraId) {
                for (const section of this.sections) {
                    const para = section.paragraphs.find(p => p.id === paraId);
                    if (para) return { section, paragraph: para };
                }
                return null;
            }

            // 노트 저장/로드
            setNote(paraId, text) {
                this.notes[paraId] = text;
            }

            getNote(paraId) {
                return this.notes[paraId] || '';
            }

            // 저장용 객체 (PDF 데이터 제외)
            toJSON() {
                return {
                    id: this.id,
                    title: this.title,
                    authors: this.authors,
                    fileName: this.fileName,
                    fileSize: this.fileSize,
                    folderId: this.folderId,
                    addedAt: this.addedAt,
                    lastRead: this.lastRead,
                    sections: this.sections,
                    notes: this.notes
                };
            }

            static fromJSON(json) {
                const doc = new PaperDocument(json.id);
                Object.assign(doc, json);
                return doc;
            }
        }

        // ========== IndexedDB ==========
        let db = null;
        const DB_NAME = 'FocusReadDB';
        const DB_VERSION = 3; // grobidCache 스토어 추가

        async function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onerror = () => reject(req.error);
                req.onsuccess = () => { db = req.result; resolve(db); };
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains('papers')) d.createObjectStore('papers', { keyPath: 'id' });
                    if (!d.objectStoreNames.contains('pdfData')) d.createObjectStore('pdfData', { keyPath: 'id' });
                    if (!d.objectStoreNames.contains('folders')) d.createObjectStore('folders', { keyPath: 'id' });
                    if (!d.objectStoreNames.contains('grobidCache')) d.createObjectStore('grobidCache', { keyPath: 'id' });
                };
            });
        }

        async function dbGetAll(store) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(store, 'readonly');
                const req = tx.objectStore(store).getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }

        async function dbGet(store, id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(store, 'readonly');
                const req = tx.objectStore(store).get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function dbPut(store, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(store, 'readwrite');
                const req = tx.objectStore(store).put(data);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function dbDelete(store, id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(store, 'readwrite');
                const objectStore = tx.objectStore(store);
                const req = objectStore.delete(id);
                
                tx.oncomplete = () => {
                    console.log(`✅ DB Delete transaction complete: ${store}/${id}`);
                    resolve();
                };
                tx.onerror = () => {
                    console.error(`❌ DB Delete transaction error: ${store}/${id}`, tx.error);
                    reject(tx.error);
                };
                req.onerror = () => {
                    console.error(`❌ DB Delete request error: ${store}/${id}`, req.error);
                };
            });
        }

        // ========== State ==========
        let papers = []; // PaperDocument[]
        let folders = [];
        let currentFilter = 'all';
        let currentFolderId = null;

        let pdfDoc = null;
        let currentPaper = null; // PaperDocument
        let currentScale = 1.0;
        let baseScale = 1.0;
        let selectedParagraph = null;
        let selectedSection = null;
        let sentences = [];
        let sentenceIndex = 0;
        let apiKey = localStorage.getItem('claude_api_key') || '';

        // ========== Init ==========
        document.addEventListener('DOMContentLoaded', async () => {
            await openDB();
            
            const papersData = await dbGetAll('papers');
            papers = papersData.map(p => PaperDocument.fromJSON(p));
            folders = await dbGetAll('folders');
            
            renderFolders();
            renderPapers();
            updateCounts();
            setupEvents();
            restoreCollapsedState();
        });

        function setupEvents() {
            document.getElementById('file-input').addEventListener('change', e => {
                if (e.target.files[0]) addPaper(e.target.files[0]);
                e.target.value = '';
            });

            document.addEventListener('dragover', e => {
                e.preventDefault();
                document.getElementById('drop-zone').classList.add('active');
            });
            document.addEventListener('dragleave', e => {
                if (!e.relatedTarget) document.getElementById('drop-zone').classList.remove('active');
            });
            document.addEventListener('drop', e => {
                e.preventDefault();
                document.getElementById('drop-zone').classList.remove('active');
                if (e.dataTransfer.files[0]?.type === 'application/pdf') {
                    addPaper(e.dataTransfer.files[0]);
                }
            });

            document.addEventListener('keydown', e => {
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                if (!selectedParagraph || !currentPaper) return;
                
                const allParas = currentPaper.sections.flatMap(s => 
                    s.paragraphs.map(p => ({ section: s, paragraph: p }))
                );
                const currentIdx = allParas.findIndex(x => x.paragraph.id === selectedParagraph.id);
                
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    // Next sentence
                    if (sentenceIndex < sentences.length - 1) {
                        sentenceIndex++;
                        highlightSentence();
                        updateActiveSentenceChunks();
                    } else if (currentIdx < allParas.length - 1) {
                        // Next paragraph
                        const next = allParas[currentIdx + 1];
                        selectParagraphAndScroll(next.section, next.paragraph);
                    }
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    // Previous sentence
                    if (sentenceIndex > 0) {
                        sentenceIndex--;
                        highlightSentence();
                        updateActiveSentenceChunks();
                    } else if (currentIdx > 0) {
                        // Previous paragraph (last sentence)
                        const prev = allParas[currentIdx - 1];
                        selectParagraphAndScroll(prev.section, prev.paragraph, 'last');
                    }
                }
            });

            document.getElementById('notes-textarea').addEventListener('input', saveNote);
            document.getElementById('chat-input').addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
            });

            // 오른쪽 패널 리사이즈
            setupPanelResize();
            setupSectionResize();
        }

        function setupPanelResize() {
            const handle = document.getElementById('resize-handle');
            const panel = document.getElementById('right-panel');
            let isResizing = false;
            let startX, startWidth;

            handle.addEventListener('mousedown', (e) => {
                isResizing = true;
                startX = e.clientX;
                startWidth = panel.offsetWidth;
                handle.classList.add('dragging');
                document.body.style.cursor = 'ew-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const diff = startX - e.clientX;
                const newWidth = Math.min(Math.max(startWidth + diff, 300), 800);
                panel.style.width = newWidth + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    handle.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        }

        // 섹션 세로 리사이즈 (여러 핸들 지원)
        function setupSectionResize() {
            const handles = document.querySelectorAll('.section-resize-handle');
            let isResizing = false;
            let currentHandle = null;
            let aboveSection = null;
            let belowSection = null;
            let startY, startAboveHeight, startBelowHeight;

            handles.forEach(handle => {
                handle.addEventListener('mousedown', (e) => {
                    const aboveId = handle.dataset.above;
                    const belowId = handle.dataset.below;
                    aboveSection = document.getElementById(aboveId);
                    belowSection = document.getElementById(belowId);
                    
                    if (!aboveSection || !belowSection) return;
                    // 접혀있는 섹션은 리사이즈 불가
                    if (aboveSection.classList.contains('collapsed') || belowSection.classList.contains('collapsed')) return;
                    
                    isResizing = true;
                    currentHandle = handle;
                    startY = e.clientY;
                    startAboveHeight = aboveSection.offsetHeight;
                    startBelowHeight = belowSection.offsetHeight;
                    handle.classList.add('dragging');
                    document.body.style.cursor = 'ns-resize';
                    document.body.style.userSelect = 'none';
                    e.preventDefault();
                });
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing || !aboveSection || !belowSection) return;
                const diff = e.clientY - startY;
                const newAboveHeight = Math.max(60, startAboveHeight + diff);
                const newBelowHeight = Math.max(60, startBelowHeight - diff);
                
                // flex 비율 대신 고정 높이 사용
                aboveSection.style.flex = 'none';
                aboveSection.style.height = newAboveHeight + 'px';
                belowSection.style.flex = 'none';
                belowSection.style.height = newBelowHeight + 'px';
            });

            document.addEventListener('mouseup', () => {
                if (isResizing && currentHandle) {
                    isResizing = false;
                    currentHandle.classList.remove('dragging');
                    currentHandle = null;
                    aboveSection = null;
                    belowSection = null;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        }

        // ========== Library ==========
        function renderFolders() {
            document.getElementById('folder-list').innerHTML = folders.map(f => `
                <div class="sidebar-item folder-item ${currentFilter === 'folder' && currentFolderId === f.id ? 'active' : ''}"
                     onclick="setFilter('folder', '${f.id}')">
                    <span>📁</span> ${f.name}
                    <span class="sidebar-item-count">${papers.filter(p => p.folderId === f.id).length}</span>
                </div>
            `).join('');
        }

        function renderPapers() {
            const search = document.getElementById('search-input').value.toLowerCase();
            let list = [...papers];

            if (currentFilter === 'recent') {
                list = list.filter(p => p.lastRead).sort((a, b) => new Date(b.lastRead) - new Date(a.lastRead)).slice(0, 10);
            } else if (currentFilter === 'folder') {
                list = list.filter(p => p.folderId === currentFolderId);
            } else {
                list.sort((a, b) => new Date(b.addedAt) - new Date(a.addedAt));
            }

            if (search) list = list.filter(p => p.title.toLowerCase().includes(search) || p.authors.toLowerCase().includes(search));

            const container = document.getElementById('paper-list-content');
            if (!list.length) {
                container.innerHTML = `<div class="empty-library"><div class="empty-library-icon">📚</div><div>논문이 없습니다</div></div>`;
                return;
            }

            container.innerHTML = list.map(p => {
                const folder = folders.find(f => f.id === p.folderId);
                return `
                    <div class="paper-item" onclick="openPaper('${p.id}')">
                        <div class="paper-title">${p.title || p.fileName}</div>
                        <div class="paper-authors">${p.authors || '-'}</div>
                        <div class="paper-meta">${formatDate(p.addedAt)}</div>
                        <div class="paper-folder">${folder ? '📁 ' + folder.name : '-'}</div>
                        <div class="paper-actions">
                            <button class="delete-btn" onclick="event.stopPropagation(); deletePaper('${p.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateCounts() {
            document.getElementById('count-all').textContent = papers.length;
            document.getElementById('count-recent').textContent = papers.filter(p => p.lastRead).length;
        }

        function setFilter(filter, folderId = null) {
            currentFilter = filter;
            currentFolderId = folderId;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            if (filter === 'folder') {
                document.querySelector(`.sidebar-item[onclick*="${folderId}"]`)?.classList.add('active');
                document.getElementById('library-title').textContent = folders.find(f => f.id === folderId)?.name || '폴더';
            } else {
                document.querySelector(`.sidebar-item[data-filter="${filter}"]`)?.classList.add('active');
                document.getElementById('library-title').textContent = filter === 'all' ? '전체 논문' : '최근 읽은';
            }
            renderPapers();
        }

        function formatDate(str) {
            const d = new Date(str);
            const diff = (Date.now() - d) / (1000 * 60 * 60 * 24);
            if (diff < 1) return '오늘';
            if (diff < 2) return '어제';
            if (diff < 7) return Math.floor(diff) + '일 전';
            return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
        }

        async function createFolder() {
            const name = document.getElementById('folder-name-input').value.trim();
            if (!name) return;
            const folder = { id: 'f_' + Date.now(), name, createdAt: new Date().toISOString() };
            await dbPut('folders', folder);
            folders.push(folder);
            renderFolders();
            closeModal('folder-modal');
            document.getElementById('folder-name-input').value = '';
        }

        // ========== Paper Management ==========
        async function addPaper(file) {
            const existing = papers.find(p => p.fileName === file.name && p.fileSize === file.size);
            if (existing) { 
                console.log('📄 Found existing paper in memory:', existing.id, existing.title);
                openPaper(existing.id); 
                return; 
            }

            try {
                console.log('📥 Adding new paper:', file.name);
                const arrayBuffer = await file.arrayBuffer();
                const dataArray = Array.from(new Uint8Array(arrayBuffer));
                const pdfData = new Uint8Array(dataArray);
                const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;

                // PaperDocument 생성
                const id = 'p_' + Date.now();
                console.log('🆔 New paper ID:', id);
                const paper = new PaperDocument(id);
                paper.fileName = file.name;
                paper.fileSize = file.size;
                paper.folderId = currentFilter === 'folder' ? currentFolderId : null;
                paper.title = file.name.replace('.pdf', '');

                // 기본 메타데이터만 추출 (구조는 렌더링 후 추출)
                await paper.extractBasicInfo(pdf);
                console.log('📋 After extractBasicInfo - title:', paper.title);

                // 저장
                await dbPut('pdfData', { id, data: dataArray });
                await dbPut('papers', paper.toJSON());
                papers.push(paper);

                updateCounts();
                renderPapers();
                renderFolders();
                openPaper(id);

            } catch (err) {
                console.error('Add paper error:', err);
                alert('오류: ' + err.message);
            }
        }

        async function deletePaper(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            console.log('🗑️ Deleting paper:', id);
            console.log('📊 Papers before delete:', papers.length, papers.map(p => p.id));
            
            try {
                await dbDelete('papers', id);
                await dbDelete('pdfData', id);
                await dbDelete('grobidCache', id); // Grobid 캐시도 삭제
            } catch (e) {
                console.error('❌ Delete failed:', e);
                alert('삭제 실패: ' + e.message);
                return;
            }
            
            papers = papers.filter(p => p.id !== id);
            console.log('📊 Papers after delete:', papers.length, papers.map(p => p.id));
            
            // DB에서 실제로 삭제되었는지 확인
            const check = await dbGet('papers', id);
            if (check) {
                console.error('❌ Paper still exists in DB after delete!');
            } else {
                console.log('✅ Confirmed: Paper removed from DB');
            }
            
            renderPapers();
            updateCounts();
        }

        async function openPaper(id) {
            currentPaper = papers.find(p => p.id === id);
            if (!currentPaper) return;

            console.log('📂 Opening paper:', id, currentPaper.title);
            console.log('📊 Current state - sections:', currentPaper.sections?.length, 'serverParsed:', currentPaper.serverParsed);
            
            currentPaper.lastRead = new Date().toISOString();
            
            // 🔄 논문 전환 시 UI 초기화
            resetReaderUI();
            
            // 캐시가 있으면 재사용, 없으면 초기화
            // (extractFromServer에서 캐시 확인함)
            
            // 파싱 상태 UI 초기화
            const statusEl = document.getElementById('parse-status');
            if (statusEl) {
                statusEl.textContent = '';
                statusEl.style.color = '';
            }

            document.getElementById('library-view').classList.add('hidden');
            document.getElementById('reader-view').classList.add('active');
            document.getElementById('back-btn').style.display = 'block';
            document.getElementById('header-title').textContent = currentPaper.title;

            const container = document.getElementById('pdf-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>로딩 중...</div>';

            try {
                const record = await dbGet('pdfData', id);
                if (!record?.data) throw new Error('PDF 데이터 없음');

                const uint8 = new Uint8Array(record.data);
                
                // 🚀 Grobid 서버로 먼저 파싱 시도
                await currentPaper.extractFromServer(record.data);
                
                // Grobid에서 제목/저자 추출 후 헤더 업데이트
                document.getElementById('header-title').textContent = currentPaper.title;
                
                pdfDoc = await pdfjsLib.getDocument({ data: uint8 }).promise;

                // 가로 꽉 차게 스케일 계산
                const page1 = await pdfDoc.getPage(1);
                const vp = page1.getViewport({ scale: 1 });
                baseScale = (container.clientWidth - 40) / vp.width;
                currentScale = baseScale;

                await renderPages();
                await renderThumbnails();
                updateZoom();
                
                // 서버 파싱 성공했으면 오버레이 그리기 (서버가 좌표 제공)
                if (currentPaper.serverParsed) {
                    const firstPara = currentPaper.sections[0]?.paragraphs[0];
                    const hasCoords = firstPara && firstPara.bounds;
                    
                    if (hasCoords) {
                        renderParagraphOverlays();
                        console.log('✅ Server provided coordinates - rendering overlays');
                    } else {
                        // 좌표 없음 - 섹션 브라우저 모드
                        console.log('⚠️ No coordinates from server - using section browser');
                        initGrobidMode();
                    }
                    
                    // Grobid 파싱 결과를 DB에 저장 (제목, 저자, 섹션 등)
                    await dbPut('papers', currentPaper.toJSON());
                    renderPapers(); // 목록 업데이트
                }

            } catch (err) {
                console.error('Open error:', err);
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div>${err.message}</div>`;
            }
        }

        // ========== PDF Rendering ==========
        async function renderPages() {
            const container = document.getElementById('pdf-container');
            container.innerHTML = '';
            const dpr = window.devicePixelRatio || 2;

            // 1단계: 모든 페이지 렌더링 (canvas + textLayer)
            const pageWrappers = [];
            
            for (let num = 1; num <= pdfDoc.numPages; num++) {
                const page = await pdfDoc.getPage(num);
                const vp = page.getViewport({ scale: currentScale });

                const wrapper = document.createElement('div');
                wrapper.className = 'pdf-page';
                wrapper.dataset.page = num;
                wrapper.style.width = vp.width + 'px';
                wrapper.style.height = vp.height + 'px';

                // Canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = vp.width * dpr;
                canvas.height = vp.height * dpr;
                canvas.style.width = vp.width + 'px';
                canvas.style.height = vp.height + 'px';
                ctx.scale(dpr, dpr);
                wrapper.appendChild(canvas);

                // Text layer
                const textLayer = document.createElement('div');
                textLayer.className = 'textLayer';
                textLayer.style.width = vp.width + 'px';
                textLayer.style.height = vp.height + 'px';
                textLayer.style.setProperty('--scale-factor', String(currentScale));
                wrapper.appendChild(textLayer);

                container.appendChild(wrapper);
                pageWrappers.push({ wrapper, page, vp, canvas, ctx, textLayer, num });
            }

            // 2단계: 렌더링 실행
            for (const pw of pageWrappers) {
                await pw.page.render({ canvasContext: pw.ctx, viewport: pw.vp }).promise;
                
                const textContent = await pw.page.getTextContent();
                await pdfjsLib.renderTextLayer({
                    textContentSource: textContent,
                    container: pw.textLayer,
                    viewport: pw.vp,
                    textDivs: []
                }).promise;
            }

            // 3단계: DOM 기반으로 문단 추출 (첫 로드 시 또는 sections가 비어있을 때)
            if (currentPaper && currentPaper.sections.length === 0) {
                currentPaper.sections = []; // 초기화
                
                for (const pw of pageWrappers) {
                    currentPaper.extractParagraphsFromDOM(pw.num, pw.textLayer, currentScale);
                }
                
                // 첫 번째 문단에서 제목 추출 (첫 페이지 상단의 가장 큰 폰트)
                if (!currentPaper.title || currentPaper.title === currentPaper.fileName.replace('.pdf', '')) {
                    const page1Paras = currentPaper.sections.flatMap(s => s.paragraphs).filter(p => p.pageNum === 1);
                    
                    if (page1Paras.length > 0) {
                        // 상단 1/3 영역의 문단들 중에서 선택
                        const topParas = page1Paras.filter(p => p.bounds.y < 200);
                        
                        if (topParas.length > 0) {
                            // y좌표가 가장 작은 (가장 위에 있는) 문단을 제목으로
                            const titlePara = topParas.reduce((a, b) => a.bounds.y < b.bounds.y ? a : b);
                            currentPaper.title = titlePara.text;
                            console.log('Title extracted:', titlePara.text);
                        } else {
                            // 상단 영역에 없으면 첫 번째 문단
                            currentPaper.title = page1Paras[0].text;
                        }
                    }
                }
                
                // 저장
                await dbPut('papers', currentPaper.toJSON());
                
                console.log('=== Extracted Structure ===');
                console.log(`Sections: ${currentPaper.sections.length}`);
                currentPaper.sections.forEach(s => {
                    console.log(`[${s.title}] ${s.paragraphs.length} paragraphs`);
                });
            }

            // 4단계: Paragraph overlay 추가
            for (const pw of pageWrappers) {
                const paraLayer = document.createElement('div');
                paraLayer.className = 'paragraph-layer';

                if (currentPaper) {
                    for (const section of currentPaper.sections) {
                        for (const para of section.paragraphs) {
                            // Grobid 모드에서는 bounds가 없음 - 스킵
                            if (!para.bounds) continue;
                            if (para.pageNum !== pw.num) continue;

                            const block = document.createElement('div');
                            block.className = 'paragraph-block' + (para.isHeading ? ' is-heading' : '');
                            // bounds는 scale=1.0 기준이므로 currentScale 곱하기
                            block.style.left = (para.bounds.x * currentScale) + 'px';
                            block.style.top = (para.bounds.y * currentScale) + 'px';
                            block.style.width = (para.bounds.w * currentScale) + 'px';
                            block.style.height = (para.bounds.h * currentScale) + 'px';
                            block.dataset.paraId = para.id;
                            block.dataset.debug = `${para.id}`;

                            paraLayer.appendChild(block);
                        }
                    }
                }
                
                // textLayer 앞에 삽입
                pw.wrapper.insertBefore(paraLayer, pw.textLayer);

                // 더블클릭 이벤트
                pw.wrapper.addEventListener('dblclick', (e) => {
                    const rect = pw.wrapper.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const result = findParagraphAtPosition(pw.num, x, y);
                    if (result) {
                        selectParagraph(result.section, result.paragraph);
                    }
                });
            }

            // 텍스트 선택 이벤트
            container.removeEventListener('mouseup', handleTextSelection);
            container.addEventListener('mouseup', handleTextSelection);
        }

        // 문단 오버레이만 다시 그리기 (서버 파싱 후 호출)
        function renderParagraphOverlays() {
            if (!currentPaper) return;
            
            const container = document.getElementById('pdf-container');
            const pageWrappers = container.querySelectorAll('.pdf-page');
            
            pageWrappers.forEach((wrapper, idx) => {
                const pageNum = idx + 1;
                
                // 기존 paragraph-layer 제거
                const existingLayer = wrapper.querySelector('.paragraph-layer');
                if (existingLayer) {
                    existingLayer.remove();
                }
                
                // 새 paragraph-layer 생성
                const paraLayer = document.createElement('div');
                paraLayer.className = 'paragraph-layer';
                
                for (const section of currentPaper.sections) {
                    for (const para of section.paragraphs) {
                        // bboxes 배열이 있으면 여러 개의 박스 생성 (다중 페이지 지원)
                        if (para.bboxes && para.bboxes.length > 0) {
                            for (const bbox of para.bboxes) {
                                if (bbox.pageNum !== pageNum) continue;
                                
                                const block = document.createElement('div');
                                block.className = 'paragraph-block' + (para.isHeading ? ' is-heading' : '');
                                block.style.left = (bbox.x * currentScale) + 'px';
                                block.style.top = (bbox.y * currentScale) + 'px';
                                block.style.width = (bbox.w * currentScale) + 'px';
                                block.style.height = (bbox.h * currentScale) + 'px';
                                block.dataset.paraId = para.id;
                                block.dataset.debug = para.id;
                                
                                paraLayer.appendChild(block);
                            }
                        } else if (para.bounds) {
                            // 기존 단일 bounds 지원 (하위호환)
                            if (para.pageNum !== pageNum) continue;
                            
                            const block = document.createElement('div');
                            block.className = 'paragraph-block' + (para.isHeading ? ' is-heading' : '');
                            block.style.left = (para.bounds.x * currentScale) + 'px';
                            block.style.top = (para.bounds.y * currentScale) + 'px';
                            block.style.width = (para.bounds.w * currentScale) + 'px';
                            block.style.height = (para.bounds.h * currentScale) + 'px';
                            block.dataset.paraId = para.id;
                            block.dataset.debug = para.id;
                            
                            paraLayer.appendChild(block);
                        }
                        // bounds가 없으면 스킵 (Grobid 전용 모드)
                    }
                }
                
                // textLayer 앞에 삽입
                const textLayer = wrapper.querySelector('.textLayer');
                if (textLayer) {
                    wrapper.insertBefore(paraLayer, textLayer);
                } else {
                    wrapper.appendChild(paraLayer);
                }
            });
            
            console.log('✅ Paragraph overlays rendered');
        }

        // 좌표로 문단 찾기 (클릭 좌표는 현재 스케일 기준)
        function findParagraphAtPosition(pageNum, clickX, clickY) {
            if (!currentPaper) return null;

            // 클릭 좌표를 scale=1.0 기준으로 변환
            const x = clickX / currentScale;
            const y = clickY / currentScale;
            
            console.log(`Click: screen(${clickX.toFixed(0)}, ${clickY.toFixed(0)}) → base(${x.toFixed(0)}, ${y.toFixed(0)}) on page ${pageNum}`);

            for (const section of currentPaper.sections) {
                for (const para of section.paragraphs) {
                    // bboxes 배열 확인 (여러 페이지/컬럼 지원)
                    if (para.bboxes && para.bboxes.length > 0) {
                        for (const b of para.bboxes) {
                            if (b.pageNum !== pageNum) continue;
                            if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
                                console.log(`✓ Found via bboxes: "${para.text.substring(0, 40)}..."`);
                                return { section, paragraph: para };
                            }
                        }
                    } else if (para.bounds) {
                        // 기존 단일 bounds (하위호환)
                        if (para.pageNum !== pageNum) continue;
                        const b = para.bounds;
                        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
                            console.log(`✓ Found via bounds: "${para.text.substring(0, 40)}..."`);
                            return { section, paragraph: para };
                        }
                    }
                }
            }
            
            console.log('✗ No paragraph at this position');
            return null;
        }

        // 텍스트 선택 완료 시 해당 문단 찾기

            const selection = window.getSelection();
            if (!selection || selection.isCollapsed || !selection.toString().trim()) return;

            // 선택 영역의 위치 가져오기
            const range = selection.getRangeAt(0);
            const rects = range.getClientRects();
            if (rects.length === 0) return;

            // 첫 번째 rect 사용
            const firstRect = rects[0];
            
            // 해당 pdf-page 찾기
            const pages = document.querySelectorAll('.pdf-page');
            for (const page of pages) {
                const pageRect = page.getBoundingClientRect();
                
                // 선택 영역이 이 페이지 안에 있는지 확인
                if (firstRect.left >= pageRect.left && firstRect.left <= pageRect.right &&
                    firstRect.top >= pageRect.top && firstRect.top <= pageRect.bottom) {
                    
                    const x = firstRect.left - pageRect.left;
                    const y = firstRect.top - pageRect.top;
                    const pageNum = parseInt(page.dataset.page);
                    
                    const result = findParagraphAtPosition(pageNum, x, y);
                    if (result) {
                        selectParagraph(result.section, result.paragraph);
                    }
                    break;
                }
            }

        async function renderThumbnails() {

            const thumbHeight = 140;

            for (let num = 1; num <= pdfDoc.numPages; num++) {
                const page = await pdfDoc.getPage(num);
                const vp = page.getViewport({ scale: 1 });
                const scale = Math.min(thumbWidth / vp.width, thumbHeight / vp.height) * 0.9;
                const scaledVp = page.getViewport({ scale });

                const item = document.createElement('div');
                item.className = 'thumbnail-item' + (num === 1 ? ' active' : '');
                item.dataset.page = num;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = scaledVp.width * 2;
                canvas.height = scaledVp.height * 2;
                canvas.style.width = scaledVp.width + 'px';
                canvas.style.height = scaledVp.height + 'px';
                ctx.scale(2, 2);

                const badge = document.createElement('div');
                badge.className = 'thumbnail-number';
                badge.textContent = num;

                item.appendChild(canvas);
                item.appendChild(badge);
                sidebar.appendChild(item);

                item.onclick = () => scrollToPage(num);
                page.render({ canvasContext: ctx, viewport: scaledVp });
