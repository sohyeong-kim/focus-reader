<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusRead - ADHD Paper Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #faf9fc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f3f0f9;
            --bg-hover: #ebe7f4;
            --border-color: #e0dce8;
            --text-primary: #2d2a33;
            --text-secondary: #5c576a;
            --text-muted: #9490a0;
            --accent-blue: #7c6aef;
            --accent-green: #10b981;
            --accent-orange: #e87f35;
            --accent-purple: #9f7aea;
            --accent-red: #ef4444;
            --accent-lavender: #a78bfa;
            --paragraph-hover: rgba(124, 106, 239, 0.08);
            --paragraph-selected: rgba(124, 106, 239, 0.15);
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            height: 48px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            -webkit-app-region: drag;
        }

        .header-title {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-actions { display: flex; gap: 8px; -webkit-app-region: no-drag; }

        .btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.15s;
        }
        .btn:hover { background: var(--bg-hover); }
        .btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); }
        .btn-primary:hover { background: #3a8eef; }
        .translate-btn { font-size: 11px; padding: 4px 10px; }
        .translate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .translate-btn.loading { background: var(--accent-orange); }

        /* Library View */
        .library-view { display: flex; height: calc(100vh - 48px); }
        .library-view.hidden { display: none; }

        .library-sidebar {
            width: 200px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 12px 0;
            overflow-y: auto;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.15s;
        }
        .sidebar-item:hover { background: var(--bg-hover); }
        .sidebar-item.active { background: var(--paragraph-selected); color: var(--text-primary); }
        .sidebar-item-count {
            margin-left: auto;
            font-size: 11px;
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .sidebar-section-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 16px 16px 8px;
        }

        .folder-item { padding-left: 24px; }
        .add-folder-btn {
            margin: 8px 12px;
            padding: 8px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            width: calc(100% - 24px);
        }
        .add-folder-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

        .library-main { flex: 1; display: flex; flex-direction: column; }

        .library-toolbar {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .library-title { font-size: 18px; font-weight: 600; }
        .library-search { flex: 1; max-width: 280px; margin-left: auto; }
        .library-search input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
        }
        .library-search input:focus { outline: none; border-color: var(--accent-blue); }

        .paper-list { flex: 1; overflow-y: auto; padding: 16px 24px; }

        .paper-list-header {
            display: grid;
            grid-template-columns: 1fr 150px 120px 100px 50px;
            gap: 12px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .paper-item {
            display: grid;
            grid-template-columns: 1fr 150px 120px 100px 50px;
            gap: 12px;
            padding: 14px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            align-items: center;
        }
        .paper-item:hover { background: var(--bg-hover); }
        .paper-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .paper-authors { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .paper-meta { font-size: 12px; color: var(--text-secondary); }
        .paper-folder { font-size: 12px; color: var(--accent-orange); }
        .paper-actions { opacity: 0; transition: opacity 0.15s; }
        .paper-item:hover .paper-actions { opacity: 1; }
        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .delete-btn:hover { background: var(--bg-tertiary); color: var(--accent-red); }

        .empty-library {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
        }
        .empty-library-icon { font-size: 48px; margin-bottom: 16px; }

        /* Reader View */
        .reader-view { display: none; height: calc(100vh - 48px); }
        .reader-view.active { display: flex; }

        .thumbnail-sidebar {
            width: 130px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 12px 8px;
            flex-shrink: 0;
        }

        .thumbnail-item {
            position: relative;
            margin-bottom: 12px;
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #fff;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .thumbnail-item:hover { border-color: var(--accent-lavender); }
        .thumbnail-item.active { border-color: var(--accent-blue); box-shadow: 0 0 0 2px rgba(124, 106, 239, 0.2); }
        .thumbnail-item canvas { max-width: 100%; max-height: 100%; }
        .thumbnail-number {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-blue);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .pdf-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .pdf-toolbar {
            height: 40px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .zoom-display {
            font-size: 12px;
            color: var(--text-secondary);
            min-width: 50px;
            text-align: center;
            font-family: 'IBM Plex Mono', monospace;
        }

        .pdf-container {
            flex: 1;
            overflow: auto;
            background: #e8e4f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .pdf-page {
            position: relative;
            background: #fff;
            box-shadow: 0 2px 12px rgba(124, 106, 239, 0.15);
            border-radius: 4px;
        }
        .pdf-page canvas { display: block; }

        /* Text Layer - 정확한 위치 */
        .textLayer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            line-height: 1.0;
            z-index: 2;
            opacity: 1;
        }
        
        .textLayer > span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }
        
        .textLayer ::selection {
            background: rgba(124, 106, 239, 0.35);
            color: transparent;
        }
        
        .textLayer br {
            display: none;
        }

        /* Paragraph Overlay - 시각적 표시 전용 */
        .paragraph-layer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
        }

        .paragraph-block {
            position: absolute;
            border-radius: 2px;
            transition: all 0.15s;
            pointer-events: none;
            border: 1px solid transparent;
        }
        .paragraph-block.selected {
            background: var(--paragraph-selected);
            border-color: var(--accent-blue);
        }
        
        /* 문장 단위 하이라이트 */
        .sentence-block {
            position: absolute;
            border-radius: 2px;
            transition: all 0.15s;
            pointer-events: none;
            z-index: 5;
        }
        .sentence-block.active {
            background: rgba(124, 106, 239, 0.35);
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 8px rgba(124, 106, 239, 0.5);
        }
        
        .paragraph-block.is-heading {
            border-left: 3px solid var(--accent-orange);
        }
        
        /* 디버그 모드 */
        .debug-mode .paragraph-layer {
            z-index: 10;
        }
        .debug-mode .paragraph-block {
            background: rgba(124, 106, 239, 0.12);
            border: 1px solid rgba(124, 106, 239, 0.4);
            pointer-events: auto;
        }
        .debug-mode .paragraph-block::after {
            content: attr(data-debug);
            position: absolute;
            top: 0;
            left: 0;
            font-size: 9px;
            background: var(--accent-blue);
            color: white;
            padding: 1px 4px;
            border-radius: 2px;
            white-space: nowrap;
            pointer-events: none;
        }
        .debug-mode .paragraph-block.is-heading {
            background: rgba(232, 127, 53, 0.12);
            border-color: rgba(232, 127, 53, 0.4);
        }
        .debug-mode .paragraph-block.is-heading::after {
            background: var(--accent-orange);
        }

        /* Right Panel */
        .right-panel {
            width: 400px;
            min-width: 300px;
            max-width: 800px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .resize-handle {
            position: absolute;
            left: -4px;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
            background: transparent;
            z-index: 10;
        }
        .resize-handle:hover {
            background: var(--accent-blue);
            opacity: 0.3;
        }
        .resize-handle.dragging {
            background: var(--accent-blue);
            opacity: 0.5;
        }

        .panel-tabs {
            display: flex;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
        }
        .panel-tab {
            flex: 1;
            padding: 10px 16px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }
        .panel-tab:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }
        .panel-tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .tab-content.active {
            display: flex;
        }

        /* All Notes Tab */
        .all-notes-header {
            flex-shrink: 0;
        }
        .all-notes-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .note-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border-left: 3px solid var(--accent-lavender);
        }
        .note-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .note-card-section {
            font-size: 11px;
            color: var(--accent-orange);
            font-weight: 600;
        }
        .note-card-page {
            font-size: 10px;
            color: var(--text-muted);
        }
        .note-card-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-card-note {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .note-card:hover {
            background: var(--bg-hover);
            cursor: pointer;
        }

        .section-header {
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-secondary); }
        .section-hint { font-size: 10px; color: var(--text-muted); }
        .section-hint kbd {
            background: var(--bg-primary);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .paragraph-section {
            flex: 3;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }
        .paragraph-section .section-header {
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
        }
        .paragraph-section .section-header:hover {
            background: var(--bg-hover);
        }
        .paragraph-section .section-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }
        .paragraph-section.collapsed {
            flex: 0 0 auto !important;
            min-height: auto;
            height: auto !important;
        }
        .paragraph-section.collapsed .section-content {
            display: none;
        }
        
        .paragraph-header {
            padding: 12px 16px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .paragraph-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-orange);
            margin-bottom: 4px;
        }
        .paragraph-page-info {
            font-size: 11px;
            color: var(--text-muted);
        }

        .paragraph-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-family: 'Literata', Georgia, serif;
            font-size: 17px;
            line-height: 2.2;
            color: var(--text-primary);
            word-spacing: 0.05em;
            letter-spacing: 0.01em;
        }
        
        /* Bionic Reading - bold first part of words */
        .paragraph-content .bionic-bold {
            font-weight: 700;
            color: var(--text-primary);
        }
        .paragraph-content .bionic-light {
            font-weight: 400;
            color: var(--text-secondary);
        }
        
        /* Semantic Chunks - colored highlights */
        .semantic-chunk {
            padding: 2px 4px;
            border-radius: 4px;
            margin: 0 1px;
            display: inline;
            line-height: 1.8;
        }
        .sentence.active .semantic-chunk {
            box-shadow: none;
        }
        
        /* Section Browser (Grobid mode) */
        .section-browser {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .section-browser-item {
            margin-bottom: 12px;
        }
        .section-browser-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-orange);
            padding: 6px 8px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .section-browser-title:hover {
            background: var(--bg-secondary);
        }
        .section-browser-paras {
            padding-left: 8px;
        }
        .section-para-item {
            font-size: 12px;
            padding: 6px 8px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1.4;
            border-left: 2px solid transparent;
        }
        .section-para-item:hover {
            background: var(--paragraph-hover);
        }
        .section-para-item.active {
            background: rgba(124, 106, 239, 0.15);
            border-left-color: var(--accent-blue);
            color: var(--text-primary);
        }
        .section-para-item.is-heading {
            font-weight: 600;
            color: var(--accent-green);
        }
        .browser-toggle {
            display: flex;
            padding: 8px 16px;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
        .browser-toggle button {
            flex: 1;
            padding: 6px 8px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .browser-toggle button.active {
            background: var(--accent-blue);
            color: white;
        }
        .section-collapse {
            display: inline-block;
            width: 14px;
            font-size: 10px;
            color: var(--text-muted);
        }

        .sentence {
            padding: 2px 4px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.12s;
            color: var(--text-muted);
            opacity: 0.6;
        }
        .sentence:hover:not(.active) { 
            background: var(--paragraph-hover); 
            opacity: 0.8;
        }
        .sentence.active {
            background: transparent;
            color: var(--text-primary);
            opacity: 1;
            font-weight: 500;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 24px;
        }
        .empty-state-icon { font-size: 32px; margin-bottom: 12px; }

        .notes-section {
            flex: 1;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
        }
        .notes-section .section-header {
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
        }
        .notes-section .section-header:hover {
            background: var(--bg-hover);
        }
        .notes-section .section-content {
            flex: 1;
            overflow: hidden;
            transition: all 0.2s ease;
            width: 100%;
        }
        .notes-section.collapsed {
            flex: 0 0 auto !important;
            min-height: auto;
            height: auto !important;
        }
        .notes-section.collapsed .section-content {
            display: none;
        }
        .notes-textarea {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background: var(--bg-primary);
            border: none;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
        }
        .notes-textarea:focus { outline: none; }
        .notes-textarea::placeholder { color: var(--text-muted); }

        /* 섹션 리사이즈 핸들 (노트/챗 사이) */
        .section-resize-handle {
            height: 6px;
            background: var(--border-color);
            cursor: ns-resize;
            flex-shrink: 0;
            transition: background 0.15s;
            position: relative;
        }
        .section-resize-handle:hover,
        .section-resize-handle.dragging {
            background: var(--accent-blue);
        }
        .section-resize-handle::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 2px;
            background: var(--text-muted);
            border-radius: 1px;
            opacity: 0.5;
        }
        .section-resize-handle:hover::after {
            opacity: 1;
            background: white;
        }

        .chat-section {
            flex: 1;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
        }
        .chat-section .section-header {
            flex-shrink: 0;
            cursor: pointer;
            user-select: none;
        }
        .chat-section .section-header:hover {
            background: var(--bg-hover);
        }
        .chat-section .section-content {
            flex: 1;
            overflow: hidden;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .chat-section.collapsed {
            flex: 0 0 auto !important;
            min-height: 0 !important;
            height: auto !important;
            max-height: none !important;
        }
        .chat-section.collapsed .section-content {
            display: none !important;
            height: 0 !important;
            min-height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
        }
        
        .collapse-icon {
            transition: transform 0.2s ease;
            font-size: 10px;
            margin-right: 6px;
        }
        .collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
        }
        .chat-message.user { align-self: flex-end; background: var(--accent-blue); color: #fff; }
        .chat-message.assistant { align-self: flex-start; background: var(--bg-tertiary); color: var(--text-primary); }
        .chat-input-area {
            padding: 10px 12px;
            background: var(--bg-tertiary);
            display: flex;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            resize: none;
        }
        .chat-input:focus { outline: none; border-color: var(--accent-blue); }
        .chat-send {
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            width: 36px;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(45, 42, 51, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(124, 106, 239, 0.15);
        }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .modal-input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 13px;
            margin-bottom: 16px;
        }
        .modal-input:focus { outline: none; border-color: var(--accent-blue); }
        .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }

        /* Drop Zone */
        .drop-zone {
            position: fixed;
            inset: 0;
            background: rgba(250, 249, 252, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }
        .drop-zone.active { display: flex; }
        .drop-zone-content {
            text-align: center;
            padding: 48px;
            border: 3px dashed var(--accent-blue);
            border-radius: 16px;
            color: var(--text-primary);

        .drop-zone-icon { font-size: 48px; margin-bottom: 16px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-tertiary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        #file-input { display: none; }

        .loading {
            display: flex;
            flex-direction: column;

            padding: 40px;
            color: var(--text-secondary);

            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
